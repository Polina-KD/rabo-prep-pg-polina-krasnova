# Block 2: a PostgreSQL primary and a replica (streaming replication). All data is invented.
# Start:  docker compose up -d        Stop and delete everything:  docker compose down -v
services:
  primary:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres          # training only: never a real password in Git
      POSTGRES_DB: delivery
    command: postgres -c shared_preload_libraries=pg_stat_statements -c wal_level=replica
    ports: ["55432:5432"]                   # 55432, so it does not clash with a local PostgreSQL
    volumes:
      - primary-data:/var/lib/postgresql   # PostgreSQL 18: mount /var/lib/postgresql, not .../data
      - ./docker/primary-init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  replica:
    image: postgres:18
    user: postgres
    environment:
      PGPASSWORD: replicator
      PGDATA: /var/lib/postgresql/18/docker
    ports: ["55433:5432"]
    depends_on:
      primary:
        condition: service_healthy
    volumes:
      - replica-data:/var/lib/postgresql
    command: >
      bash -c "if [ ! -s $$PGDATA/PG_VERSION ]; then
      until pg_basebackup -h primary -U replicator -D $$PGDATA -R -X stream; do sleep 2; done;
      chmod 0700 $$PGDATA; fi; exec postgres"

volumes:
  primary-data:
  replica-data:
