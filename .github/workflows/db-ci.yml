name: Database CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:                       # a fresh, empty database for every run
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delivery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/delivery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations, first run
        run: python -m pg_ops.migrate
      - name: Migrations, second run (must change nothing)
        run: python -m pg_ops.migrate
      - name: Validation tests (pytest)
        run: pytest
