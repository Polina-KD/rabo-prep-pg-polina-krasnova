[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-ops"
version = "0.1.0"
description = "Small PostgreSQL operations tools for the Motopp Rabobank interview preparation (Block 2)"
authors = [{ name = "Polina Krasnova" }]
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pip-audit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pg_ops"]
